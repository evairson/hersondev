# Site nginx du portfolio, à copier dans /etc/nginx/sites-available/hersondev
# Remplacer DOMAINE par le vrai nom de domaine.
server {
    listen 80;
    listen [::]:80;
    server_name herson.fr www.herson.fr;

    root /var/www/hersondev;
    index index.html;

    # Application React (react-router) : toutes les routes renvoient index.html,
    # comme le faisait le .htaccess sur OVH.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers générés par le build : leur nom contient un hash, on peut les cacher longtemps.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
