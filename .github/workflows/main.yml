name: Deploy React App to VM

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    # Self-hosted runner installed on the VM (label "hersondev").
    runs-on: [self-hosted, hersondev]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install and build
      run: |
        npm ci
        npm run build

    - name: Publish the build to nginx
      run: rsync -a --delete build/ /var/www/hersondev/
